ServerTokens Prod
ServerSignature Off
<VirtualHost *:80>
    DocumentRoot /var/www/screenport/public
    <Directory /var/www/screenport/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
    # Trust the TLS termination flag ONLY from a reverse proxy on the private Docker network.
    # Configure an HTTPS virtual host directly, or use the TLS proxy setup described in README.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
